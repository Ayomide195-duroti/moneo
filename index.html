<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moneo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Inter,system-ui,sans-serif;color:#0f172a;background:#f3f6ff}
.card{width:100%;max-width:440px;background:#fff;border:1px solid #eef1f7;border-radius:32px;padding:32px 24px;text-align:center;box-shadow:0 24px 60px -28px rgba(6,37,94,.28)}
.logo{width:170px;border-radius:16px;margin-bottom:20px}
h1{margin:0 0 8px;font-size:26px;font-weight:600}
p{margin:0 0 24px;color:#475569;font-size:15px;word-break:break-word}
a.btn{display:flex;align-items:center;justify-content:center;height:54px;border-radius:999px;background:#06255E;color:#fff;font-weight:600;text-decoration:none}
a.btn:hover{background:#041a45}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="logo.png" alt="Moneo">
  <h1 id="hello">Loading...</h1>
  <p id="who"></p>
  <a class="btn" href="login.html#logout">Log out</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  var sb = window.supabase.createClient(
    "https://pgfsowumyjzuwegrctfn.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBnZnNvd3VteWp6dXdlZ3JjdGZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0NDUwOTcsImV4cCI6MjEwOTAyMTA5N30.Vn7ILVTysY6QChWtBQ35kTdbF6r3FoezaDYKNjHQxcU",
    { auth: { flowType: "pkce", persistSession: true, autoRefreshToken: true, storage: {
      getItem: function (k) { var v = localStorage.getItem(k); return v !== null ? v : sessionStorage.getItem(k); },
      setItem: function (k, v) { (localStorage.getItem("moneo_remember") !== "0" ? localStorage : sessionStorage).setItem(k, v); },
      removeItem: function (k) { localStorage.removeItem(k); sessionStorage.removeItem(k); }
    } } }
  );
  sb.auth.getSession().then(function (r) {
    var s = r.data.session;
    if (!s) { location.replace("login.html"); return; }
    var u = s.user, name = (u.user_metadata && (u.user_metadata.full_name || u.user_metadata.name)) || "";
    document.getElementById("hello").textContent = name ? "Welcome, " + name : "Welcome";
    document.getElementById("who").textContent = "Signed in as " + u.email;
  });
})();
</script>
</body>
</html>
